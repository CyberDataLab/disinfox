services:
  mongodb:
    image: mongo:8.0.4
    volumes:
      - mongo-data:${MONGODB_DATA_PATH}
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGODB_DB}

  backend:
    build: ./backend
    depends_on:
      - mongodb
    ports:
      - "8888:5000"
    restart: always # this prevents a startup failure (becouse of mongodb not being ready)
    environment:
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=${MONGODB_PORT}
      - MONGODB_DB=${MONGODB_DB}
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - READONLY=1
      - FLASK_DEBUG=1
      - API_KEY_READONLY=${API_KEY_READONLY}
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_EXTERNAL_PORT}:5000"
    depends_on:
      - backend
    restart: always # this prevents a startup failure (becouse of backend not being ready)
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=5000
      - LAST_UPDATE=${LAST_COMMIT}
      - READONLY=1
      - FLASK_DEBUG=1
      - API_KEY_READONLY=${API_KEY_READONLY}
      - SECRET_KEY=${FRONTEND_SECRET_KEY}
      - VERIFICATION_REQUIRED=${VERIFICATION_REQUIRED} # New environment variable for email verification
    volumes:
      - ./frontend:/app


  public-api:
    build: ./public-api
    ports:
      - "${PUBLIC_API_EXTERNAL_PORT}:5000"
    depends_on:
      - backend
    restart: always # this prevents a startup failure (becouse of backend not being ready)
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=5000
      - FLASK_DEBUG=1
    volumes:
      - ./public-api:/app

volumes:
  mongo-data:
    driver: local