{% extends 'base.html' %}

{% block content %}
    <h1>Profile</h1>
    <div class="d-flex mt-5 mb-5">
        <div class="d-flex me-5">
            <img src="https://i.kym-cdn.com/photos/images/original/002/901/902/95c.png" 
            alt="Profile picture" width="200" height="200" class="rounded border border-3 border-primary me-5">
        </div>
        <div class="d-flex flex-column me-5 justify-content-evenly ">
            <h2>User information</h2>
            <div>
            First name: {{ user.firstName }}
            </div>
            <div>
            Last name: {{ user.lastName }}
            </div>
            <div>
            Email: {{ user.email }}
            </div>  
        </div>
    </div>
        <div>
            <h2>Saved incidents</h2>
        </div>
    </div>

{% endblock %}
